name: 💡 Feature Request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! To help us understand the request, please tell us about the *problem* first, then your proposed solution.

  - type: checkboxes
    id: existing-issue-check
    attributes:
      label: Is there an existing issue/request for this?
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package does this relate to?
      options:
        - "@cookieyes/core"
        - "@cookieyes/react"
        - "@cookieyes/nextjs"
        - "@cookieyes/cli"
        - "@cookieyes/translations"
        - Not sure / multiple / other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation or limitation you're running into. Focus on the "why" before the "what."
      placeholder: "I'm trying to do X, but currently I can't because..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Your proposed solution
      description: What would you like to see happen? A rough API shape, config option, or behavior change is helpful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds you're currently using, or other approaches you thought about.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else — links, mockups, related issues.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Are you willing to submit a PR for this?
      options:
        - label: Yes, I'd like to work on this.
          required: false
