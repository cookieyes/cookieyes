name: 🌐 Request a locale
description: Ask for a new translation in @cookieyes/translations
title: "[locale] "
labels: ["help-wanted", "lane:i18n"]
body:
  - type: markdown
    attributes:
      value: |
        Translations are an **open lane** — outside contributors are welcome to build these.

        **Want to translate it yourself? You don't need an issue.** Copy
        `sdk/translations/src/en.ts` to `<code>.ts`, translate it, and open a pull request — CI
        checks every key is there. See [Adding a language](https://github.com/cookieyes/cookieyes/blob/main/CONTRIBUTING.md#adding-a-vendor-or-a-language).
        Use this form to *ask* for a language you'd like someone to add. One issue per locale. A maintainer adds a `roadmap:*` label to place it on the [Roadmap](https://github.com/orgs/cookieyes/projects/3).

  - type: input
    id: locale
    attributes:
      label: Locale
      description: Language name and its BCP 47 code.
      placeholder: "e.g. Dutch — nl"
    validations:
      required: true

  - type: input
    id: file-path
    attributes:
      label: Target file
      description: Where the new locale table will live, named by its BCP 47 code.
      value: "sdk/translations/src/<code>.ts"
    validations:
      required: true

  - type: dropdown
    id: fluency
    attributes:
      label: Your fluency
      description: Translations should come from a native or professional-level speaker.
      options:
        - Native speaker
        - Professional / fluent
        - Not me — requesting it for someone else to build
    validations:
      required: true

  - type: checkboxes
    id: acceptance
    attributes:
      label: Acceptance checklist
      description: The PR that closes this issue must satisfy every item.
      options:
        - label: "Locale table added at `sdk/translations/src/<code>.ts`, typed as `TranslationMap`"
        - label: "Every key in `en.ts` is translated — no English left behind, no extra keys"
        - label: "Sub-path export `./<code>` added to `sdk/translations/package.json` (the build and tests pick up the new file on their own, and CI says if the export is missing)"
        - label: "Translation reviewed by a second native or fluent speaker"
        - label: "Changeset added (`pnpm changeset`) for `@cookieyes/translations`"
        - label: "`pnpm lint`, `pnpm typecheck` and `pnpm test` pass"

  - type: textarea
    id: contribute
    attributes:
      label: Want to build this?
      value: No need to claim it — copy `en.ts`, meet the checklist above, and open a pull request that says "Closes #" followed by this issue's number.
