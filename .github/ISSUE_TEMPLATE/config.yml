# Every *.yml form in this folder shows in the chooser: Bug Report, Feature Request,
# and the two open-lane request templates (Request a vendor integration, Request a locale).
# Disables the option to open a blank/freeform issue, forcing use of those templates.
blank_issues_enabled: false

contact_links:
  - name: 🔒 Report a security vulnerability
    url: https://github.com/cookieyes/cookieyes/security/advisories/new
    about: Please do NOT report security vulnerabilities as a public issue. Use private reporting instead.

  - name: 💬 Ask a question / general discussion
    url: https://github.com/cookieyes/cookieyes/discussions
    about: For questions and open-ended discussion, please use Discussions instead of an issue.

  # TODO: switch to https://docs.cookieyes.com once the docs site is live.
  - name: 📖 Documentation
    url: https://github.com/cookieyes/cookieyes/tree/main/docs
    about: Check the docs before filing an issue — your question might already be answered there.
