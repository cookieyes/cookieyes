name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance

jobs:
  release:
    name: Version & publish
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the "Detect release work" step can diff the push range.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # changeset publish's "already published?" registry check is unreliable in
      # this CI, so on a no-op push (no changeset, no version bump) it tries to
      # republish existing versions and fails. Gate the release on real work,
      # detected without a registry read:
      #   (a) pending changeset files  -> action opens/updates the Version PR
      #   (b) a version was bumped in this push (Version-PR merge) -> publish
      # Otherwise (dependency/CI/workflow merges) skip so the run stays green.
      - name: Detect release work
        id: detect
        run: |
          work=false
          if ls .changeset/*.md >/dev/null 2>&1 && [ "$(ls .changeset/*.md | grep -vc 'README')" -gt 0 ]; then
            echo "Pending changesets present -> will open/update the Version PR"
            work=true
          elif git diff "${{ github.event.before }}" "${{ github.sha }}" -- 'sdk/*/package.json' 2>/dev/null \
               | grep -qE '^\+[[:space:]]*"version":'; then
            echo "Version bump detected in this push -> will publish"
            work=true
          else
            echo "No changesets and no version bump -> nothing to release; skipping"
          fi
          echo "work=$work" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        if: steps.detect.outputs.work == 'true'
        uses: pnpm/action-setup@v5

      - name: Setup Node
        if: steps.detect.outputs.work == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Ensure a recent npm for Trusted Publishing/OIDC (needs npm >= 11.5).
      - name: Upgrade npm
        if: steps.detect.outputs.work == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.detect.outputs.work == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build packages
        if: steps.detect.outputs.work == 'true'
        run: pnpm build

      - name: Create release PR or publish to npm
        id: changesets
        if: steps.detect.outputs.work == 'true'
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # The docs changelog needs each release's date, and changesets records none: the
      # only record is the tag `changeset publish` just created (see
      # tools/changelog/collect-dates.mjs). Collected by hand, this was missed after the
      # 7 October 2026 release, and the docs build passed without it because it treats a
      # package's current version as not yet released. Collect the dates here, from this
      # run's own tags, and open a PR to main, so a release cannot reach npm without
      # reaching the docs. A PR rather than a push: main takes changes through PRs.
      - name: Record release dates for the docs changelog
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm changelog:dates
          if git diff --quiet -- tools/changelog/release-dates.json; then
            echo "Release dates already recorded; nothing to do"
            exit 0
          fi
          branch="chore/changelog-dates-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add tools/changelog/release-dates.json
          git commit -m "docs(web): record the dates of the release just published"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "docs(web): record the dates of the release just published" \
            --body "Adds the publish dates of the versions released in this run to \`tools/changelog/release-dates.json\`, so the docs changelog lists the release. Before merging, add a one-line title for the release to \`tools/changelog/release-titles.json\` (optional; without one it is labelled by its version)."
