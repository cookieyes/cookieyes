name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance

jobs:
  release:
    name: Version & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # No registry-url here on purpose: it makes setup-node write an .npmrc
      # with `_authToken=${NODE_AUTH_TOKEN}`, which is unset under OIDC. That
      # empty token breaks `changeset publish`'s "is this version already
      # published?" registry read, making it try to republish existing versions
      # on no-op pushes. npm defaults to registry.npmjs.org, and OIDC handles
      # publish auth, so dropping it leaves a clean anonymous read.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Ensure a recent npm for Trusted Publishing/OIDC (needs npm >= 11.5).
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
