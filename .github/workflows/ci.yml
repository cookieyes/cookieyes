name: CI

on:
  push:
    branches: [main, integration/next-release]
  pull_request:
    # `integration/next-release` is included so a feature PR aimed at the
    # integration branch still gets lint/typecheck/build/test — without it,
    # only the path-filtered peer-matrix workflow (which has no `branches:`
    # filter) runs, and the integration branch accumulates merges that this
    # pipeline never checked.
    branches: [main, integration/next-release]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN: both jobs only read the repository.
permissions:
  contents: read

jobs:
  peer-deps-derive-check:
    name: Peer-dependency matrix derive-check
    runs-on: ubuntu-latest
    # No Node-version dependency (parses package.json/matrix.config.mjs text
    # only, no install) — a separate job from `build` so it doesn't
    # triple-run across the Node matrix. See
    # ai-context/designs/peer-dependency-matrix.md §5.6.
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install root dependencies only (semver, for derive-check.mjs)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Derive-from-peerDeps enforcement
        run: pnpm peer-matrix:derive-check

  build:
    name: Lint, typecheck, build & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Build web app
        run: pnpm build:web

      - name: Test
        run: pnpm test

  size-budget:
    name: Bundle-size budget
    runs-on: ubuntu-latest
    # A single Node version on purpose. The measurement is a *delta* against a
    # control app built in the same job, so it is insensitive to the runner —
    # but running it three times across the Node matrix would produce three
    # near-identical numbers and invite arguing about which one is the figure.
    # There is one figure, and it comes from here.
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The fixtures install the SDK from packed tarballs, so `dist/` must exist
      # and must be current. `measure.mjs` fails loudly on a missing one rather
      # than quietly measuring nothing.
      - name: Build SDK
        run: pnpm build

      - name: Measure and enforce budgets
        run: pnpm size:check

      # Uploaded whether or not the budget passed: on a failure this is the
      # evidence for what grew, and re-running the job to find out is worse.
      - name: Upload size report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: size-report
          path: tools/size/size-report.json
          if-no-files-found: error
