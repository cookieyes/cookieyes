version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Matches minimumReleaseAge in pnpm-workspace.yaml. Without it, Dependabot proposes
    # versions pnpm refuses to install, and its PRs fail for their first three days.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
